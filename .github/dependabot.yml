version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint refuses to run on TypeScript 7, which stops lint. Remove once it does.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Major Node versions alternate between LTS and short-lived, so choose them by hand.
      - dependency-name: node
        update-types: [version-update:semver-major]
